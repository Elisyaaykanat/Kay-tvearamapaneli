<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kayıt ve Arama Paneli</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2c3e50">

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            background-color: white;
            padding: 0 15px 15px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        /* Üst kısmı sabit tutan kapsayıcı */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: white;
            z-index: 100;
            padding-top: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 19px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr 1.5fr auto;
            gap: 6px;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #219653; }
        
        /* Daraltılmış Excel Alanı */
        .excel-section {
            background-color: #f8f9fa;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px dashed #cbd5e1;
        }
        .excel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .excel-header strong {
            font-size: 13px;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 36px;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 12px;
            resize: vertical;
        }
        .excel-btn-group {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }
        .excel-btn {
            background-color: #2980b9;
            padding: 6px 10px;
            font-size: 12px;
            margin-top: 0;
        }
        .excel-btn:hover { background-color: #2471a3; }

        .export-btn {
            background-color: #16a085;
            padding: 6px 10px;
            font-size: 12px;
            margin-top: 0;
        }
        .export-btn:hover { background-color: #138d75; }

        .search-box { margin-bottom: 0; }
        .search-box input {
            font-size: 14px;
            padding: 8px 10px;
            background-color: #fffdf4;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .tc-hucre {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .tc-no {
            white-space: nowrap;
        }
        
        .islem-td { display: flex; gap: 4px; }
        .kopyala-btn {
            background-color: #f39c12;
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            flex-shrink: 0;
        }
        .kopyala-btn:hover { background-color: #d68910; }

        .sil-btn {
            background-color: #e74c3c;
            padding: 5px 8px;
            font-size: 11px;
            width: auto;
        }
        .sil-btn:hover { background-color: #c0392b; }

        .duzenle-btn {
            background-color: #27ae60;
            padding: 5px 8px;
            font-size: 11px;
            width: auto;
        }
        .duzenle-btn:hover { background-color: #219653; }

        .info-text {
            font-size: 11px;
            color: #666;
        }

        @media screen and (max-width: 768px) {
            body { padding: 5px; }
            .container { padding: 0 10px 10px 10px; }
            .form-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .form-grid button { grid-column: span 2; }
            .excel-btn-group { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sticky-header">
            <h2 id="panelBaslik">Araç ve Kişi Kayıt Yönetim Paneli</h2>

            <div class="form-grid">
                <input type="text" id="adiSoyadi" placeholder="ADI SOYADI" oninput="this.value = this.value.toLocaleUpperCase('tr-TR')">
                <input type="text" id="tcNo" inputmode="numeric" pattern="[0-9]*" placeholder="TC KİMLİK NO (11 hane)" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <input type="text" id="dogumTarihi" inputmode="numeric" placeholder="GG.AA.YYYY (Örn: 05111979)" maxlength="10" oninput="tarihBicimlendir(this)">
                <input type="text" id="plaka" placeholder="PLAKA" oninput="this.value = this.value.toLocaleUpperCase('tr-TR')">
                <button id="islemButon" onclick="kayitIslemiYap()">Ekle</button>
            </div>

            <div class="excel-section">
                <div class="excel-header">
                    <strong>Excel İşlemleri:</strong>
                    <span class="info-text">Excel'den yapıştırıp toplu ekleyin veya sütunlu indirin.</span>
                </div>
                <textarea id="excelInput" placeholder="Örnek: Adı soyadı, tc kimlik no, doğum tarihi, plaka."></textarea>
                <div class="excel-btn-group">
                    <button class="excel-btn" onclick="exceldenAktar()">Toplu Aktar (İçe Aktar)</button>
                    <button class="export-btn" onclick="excelsIndir()">📊 Tüm Kayıtları Excel Olarak İndir (Sütunlu)</button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="aramaInput" oninput="this.value = this.value.toLocaleUpperCase('tr-TR')" onkeyup="filtrele()" placeholder="🔍 İSİM, TC, PLAKA ARA...">
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ADI SOYADI</th>
                        <th>TC KİMLİK NO</th>
                        <th>DOĞUM TARİHİ</th>
                        <th>PLAKA</th>
                        <th style="width: 115px;">İŞLEM</th>
                    </tr>
                </thead>
                <tbody id="tabloGovdesi"></tbody>
            </table>
        </div>
    </div>

    <script>
        let kayitlar = JSON.parse(localStorage.getItem("gelismisKayitlar")) || [];
        let duzenlenenIndex = null;

        window.onload = function() {
            kayitlariSirala();
            listeyiCiz(kayitlar);
        };

        function kayitlariSirala() {
            kayitlar.sort((a, b) => {
                let isimA = (a.adi || "").trim();
                let isimB = (b.adi || "").trim();
                if (!isimA && !isimB) return 0;
                if (!isimA) return 1;
                if (!isimB) return -1;
                return isimA.localeCompare(isimB, 'tr-TR');
            });
        }

        function tarihBicimlendir(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 4) {
                val = val.substring(0, 2) + '.' + val.substring(2);
            } else if (val.length > 4) {
                val = val.substring(0, 2) + '.' + val.substring(2, 4) + '.' + val.substring(4, 8);
            }
            input.value = val;
        }

        function kayitIslemiYap() {
            let adi = document.getElementById("adiSoyadi").value.trim().toLocaleUpperCase('tr-TR');
            let tc = document.getElementById("tcNo").value.trim().replace(/\D/g, '');
            let dogum = document.getElementById("dogumTarihi").value.trim();
            let plaka = document.getElementById("plaka").value.trim().toLocaleUpperCase('tr-TR');

            if (tc !== "" && tc.length !== 11) {
                alert("Hata: TC Kimlik Numarası eksiksiz 11 haneli olmalıdır! (Şu anki hane: " + tc.length + ")");
                return;
            }

            if (!adi && !tc && !plaka) {
                alert("Lütfen en azından bir alan doldurun!");
                return;
            }

            if (duzenlenenIndex === null) {
                kayitlar.push({ adi, tc, dogum, plaka });
            } else {
                kayitlar[duzenlenenIndex] = { adi, tc, dogum, plaka };
                duzenlenenIndex = null;
                document.getElementById("islemButon").innerText = "Ekle";
                document.getElementById("islemButon").style.backgroundColor = "#27ae60";
                document.getElementById("panelBaslik").innerText = "Araç ve Kişi Kayıt Yönetim Paneli";
            }

            kaydetVeYenile();
            formuTemizle();
        }

        function duzenleBaslat(index) {
            let item = kayitlar[index];
            document.getElementById("adiSoyadi").value = item.adi;
            document.getElementById("tcNo").value = item.tc;
            document.getElementById("dogumTarihi").value = item.dogum;
            document.getElementById("plaka").value = item.plaka;

            duzenlenenIndex = index;
            document.getElementById("islemButon").innerText = "Güncelle";
            document.getElementById("islemButon").style.backgroundColor = "#2980b9";
            document.getElementById("panelBaslik").innerText = "Kayıt Düzenleniyor (Satır #" + (index + 1) + ")";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formuTemizle() {
            document.getElementById("adiSoyadi").value = "";
            document.getElementById("tcNo").value = "";
            document.getElementById("dogumTarihi").value = "";
            document.getElementById("plaka").value = "";
        }

        function exceldenAktar() {
            let text = document.getElementById("excelInput").value.trim();
            if (!text) {
                alert("Lütfen kutuya veri yapıştırın!");
                return;
            }

            let satirlar = text.split("\n");
            let eklenenSayisi = 0;

            satirlar.forEach(satir => {
                if (!satir.trim()) return;
                
                if (satir.toLocaleUpperCase('tr-TR').includes("ADI SOYADI") || satir.toLocaleUpperCase('tr-TR').includes("TC KİMLİK") || satir.toUpperCase().includes("TC KIMLIK")) {
                    return;
                }

                let sutunlar = satir.split("\t");
                if (sutunlar.length < 4) {
                    sutunlar = satir.trim().split(/\s{2,}/);
                }

                if (sutunlar.length >= 3) {
                    let adi = sutunlar[0] ? sutunlar[0].trim().toLocaleUpperCase('tr-TR') : "";
                    let tc = sutunlar[1] ? sutunlar[1].trim().replace(/\D/g, '') : "";
                    let dogum = sutunlar[2] ? sutunlar[2].trim() : "";
                    let plaka = sutunlar[3] ? sutunlar[3].trim().toLocaleUpperCase('tr-TR') : "";

                    kayitlar.push({ adi, tc, dogum, plaka });
                    eklenenSayisi++;
                }
            });

            if (eklenenSayisi > 0) {
                kaydetVeYenile();
                document.getElementById("excelInput").value = "";
                alert(eklenenSayisi + " adet kayıt başarıyla eklendi!");
            } else {
                alert("Aktarılabilecek uygun format bulunamadı. Lütfen verileri doğrudan Excel'den seçip kopyalayın.");
            }
        }

        function excelsIndir() {
            if (kayitlar.length === 0) {
                alert("İndirilecek kayıt bulunmuyor!");
                return;
            }

            let csvContent = "\uFEFFADI SOYADI;TC KIMLIK NO;DOGUM TARIHI;PLAKA\n";
            kayitlar.forEach(item => {
                csvContent += `${item.adi};${item.tc};${item.dogum};${item.plaka}\n`;
            });

            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            a.href = url;
            a.download = "kayitlar_listesi.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function tcKopyala(index, btn) {
            let item = kayitlar[index];
            let sadeceRakamlardanTc = (item.tc || "").replace(/\D/g, '');

            if (!sadeceRakamlardanTc) {
                alert("Kopyalanacak TC kimlik numarası bulunmuyor!");
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(sadeceRakamlardanTc).then(() => {
                    butonGeriBildirimi(btn);
                }).catch(() => {
                    eskiYontemleKopyala(sadeceRakamlardanTc, btn);
                });
            } else {
                eskiYontemleKopyala(sadeceRakamlardanTc, btn);
            }
        }

        function eskiYontemleKopyala(metin, btn) {
            let geciciInput = document.createElement("textarea");
            geciciInput.value = metin;
            geciciInput.setAttribute("readonly", "");
            geciciInput.style.position = "absolute";
            geciciInput.style.left = "-9999px";
            document.body.appendChild(geciciInput);
            geciciInput.select();
            geciciInput.setSelectionRange(0, metin.length);
            try {
                document.execCommand("copy");
                butonGeriBildirimi(btn);
            } catch (e) {
                alert("TC kopyalanamadı: " + metin);
            }
            document.body.removeChild(geciciInput);
        }

        function butonGeriBildirimi(btn) {
            let eskiYazi = btn.innerText;
            btn.innerText = "Kopyalandı!";
            btn.style.backgroundColor = "#2c3e50";
            setTimeout(() => {
                btn.innerText = eskiYazi;
                btn.style.backgroundColor = "#f39c12";
            }, 1500);
        }

        function sil(index) {
            if (confirm("Bu kaydı silmek istediğinize emin misiniz?")) {
                kayitlar.splice(index, 1);
                if (duzenlenenIndex === index) {
                    duzenlenenIndex = null;
                    formuTemizle();
                    document.getElementById("islemButon").innerText = "Ekle";
                    document.getElementById("islemButon").style.backgroundColor = "#27ae60";
                    document.getElementById("panelBaslik").innerText = "Araç ve Kişi Kayıt Yönetim Paneli";
                }
                kaydetVeYenile();
            }
        }

        function kaydetVeYenile() {
            kayitlariSirala();
            localStorage.setItem("gelismisKayitlar", JSON.stringify(kayitlar));
            
            if (document.getElementById("aramaInput").value.trim() !== "") {
                filtrele();
            } else {
                listeyiCiz(kayitlar);
            }
        }

        function listeyiCiz(veriDizisi) {
            let tbody = document.getElementById("tabloGovdesi");
            tbody.innerHTML = "";

            if (veriDizisi.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#888;'>Kayıt bulunamadı.</td></tr>";
                return;
            }

            veriDizisi.forEach((item) => {
                let gercekIndex = kayitlar.indexOf(item);
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.adi}</td>
                    <td>
                        <div class="tc-hucre">
                            <span class="tc-no">${item.tc}</span>
                            <button type="button" class="kopyala-btn" onclick="tcKopyala(${gercekIndex}, this)">Kopyala</button>
                        </div>
                    </td>
                    <td>${item.dogum}</td>
                    <td>${item.plaka}</td>
                    <td>
                        <div class="islem-td">
                            <button type="button" class="duzenle-btn" onclick="duzenleBaslat(${gercekIndex})">Düzenle</button>
                            <button type="button" class="sil-btn" onclick="sil(${gercekIndex})">Sil</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrele() {
            let aramaKelimesi = document.getElementById("aramaInput").value.toLocaleLowerCase('tr-TR');
            let filtrelenmis = kayitlar.filter(item => {
                return item.adi.toLocaleLowerCase('tr-TR').includes(aramaKelimesi) ||
                       item.tc.toLocaleLowerCase('tr-TR').includes(aramaKelimesi) ||
                       item.dogum.toLocaleLowerCase('tr-TR').includes(aramaKelimesi) ||
                       item.plaka.toLocaleLowerCase('tr-TR').includes(aramaKelimesi);
            });
            listeyiCiz(filtrelenmis);
        }
    </script>
</body>
</html>
